<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">How LockIn works</title>
  <desc id="d">The extension watches the Google Form tab, talks to the desktop companion over native messaging, and sends events and a heartbeat to a Google Apps Script web app, which writes them into the professor's Google Sheet.</desc>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif }
  @media (prefers-reduced-motion: reduce) { circle[opacity="0"] { display: none } }
  </style>
  <rect width="1200" height="430" rx="24" fill="#09090B"/>

  <rect x="36" y="34" width="1128" height="176" rx="18" fill="none" stroke="#71717A" stroke-dasharray="2 6" stroke-width="1.5"/>
  <text x="58" y="66" font-size="12.5" font-weight="700" letter-spacing="1" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STUDENT'S COMPUTER</text>
  <text x="1142" y="400" font-size="12.5" font-weight="700" letter-spacing="1" fill="#A1A1AA" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PROFESSOR</text>

  
  <path d="M340 145 L460 145" stroke="#71717A" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
  <text x="400" y="132" font-size="12.5" fill="#A1A1AA" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tabs · sites · paste</text>
  
  <path d="M740 145 L860 145" stroke="#71717A" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
  <text x="800" y="132" font-size="12.5" fill="#A1A1AA" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">native msg</text>
  
  <path d="M600 190 L600 290" stroke="#71717A" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
  <text x="614" y="245" font-size="12.5" fill="#A1A1AA" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">events + heartbeat, 1/min (optional)</text>
  
  <path d="M740 335 L860 335" stroke="#71717A" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
  <text x="800" y="322" font-size="12.5" fill="#A1A1AA" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rows</text>

  
  <g>
    <rect x="60" y="100" width="280" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    
    <text x="82" y="140" font-size="18" font-weight="650" fill="#FAFAFA">Google Form</text>
    <text x="82" y="164" font-size="13.5" fill="#A1A1AA">the exam tab</text>
  </g>
  
  <g>
    <rect x="460" y="100" width="280" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    <rect x="460" y="118" width="4" height="54" rx="2" fill="#16A34A"/>
    <text x="482" y="140" font-size="18" font-weight="650" fill="#FAFAFA">LockIn extension</text>
    <text x="482" y="164" font-size="13.5" fill="#A1A1AA">switch, rules, status</text>
  </g>
  
  <g>
    <rect x="860" y="100" width="280" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    
    <text x="882" y="140" font-size="18" font-weight="650" fill="#FAFAFA">Desktop companion</text>
    <text x="882" y="164" font-size="13.5" fill="#A1A1AA">Word, Notes, PDF, ChatGPT app</text>
  </g>
  
  <g>
    <rect x="460" y="290" width="280" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    
    <text x="482" y="330" font-size="18" font-weight="650" fill="#FAFAFA">Apps Script web app</text>
    <text x="482" y="354" font-size="13.5" fill="#A1A1AA">/exec endpoint</text>
  </g>
  
  <g>
    <rect x="860" y="290" width="280" height="90" rx="14" fill="#18181B" stroke="#27272A"/>
    <rect x="860" y="308" width="4" height="54" rx="2" fill="#16A34A"/>
    <text x="882" y="330" font-size="18" font-weight="650" fill="#FAFAFA">Google Sheet</text>
    <text x="882" y="354" font-size="13.5" fill="#A1A1AA">Events · Live Status</text>
  </g>

  
  <circle r="6" fill="#16A34A" opacity="0">
    <animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M340 145 L460 145"/>
    <animate attributeName="opacity" dur="2.2s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/>
  </circle>
  
  <circle r="6" fill="#71717A" opacity="0">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M460 145 L340 145"/>
    <animate attributeName="opacity" dur="2.2s" begin="1.1s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/>
  </circle>
  
  <circle r="6" fill="#16A34A" opacity="0">
    <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M860 145 L740 145"/>
    <animate attributeName="opacity" dur="2.6s" begin="0.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/>
  </circle>
  
  <circle r="6" fill="#71717A" opacity="0">
    <animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" path="M740 145 L860 145"/>
    <animate attributeName="opacity" dur="2.6s" begin="1.7s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/>
  </circle>
  
  <circle r="6" fill="#16A34A" opacity="0">
    <animateMotion dur="2.0s" begin="0.2s" repeatCount="indefinite" path="M600 190 L600 290"/>
    <animate attributeName="opacity" dur="2.0s" begin="0.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/>
  </circle>
  
  <circle r="6" fill="#DC2626" opacity="0">
    <animateMotion dur="6.0s" begin="3.0s" repeatCount="indefinite" path="M600 190 L600 290"/>
    <animate attributeName="opacity" dur="6.0s" begin="3.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/>
  </circle>
  
  <circle r="6" fill="#16A34A" opacity="0">
    <animateMotion dur="2.0s" begin="1.2s" repeatCount="indefinite" path="M740 335 L860 335"/>
    <animate attributeName="opacity" dur="2.0s" begin="1.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/>
  </circle>
</svg>
